services:
  - type: web
    name: clinic-analyst
    runtime: python
    plan: 0.5c-512mb
    region: virginia
    branch: cursor/clinic-analyst-first-pass-5759
    buildCommand: pip install -e ".[web]"
    startCommand: uvicorn web.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    disk:
      name: warehouse
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: WAREHOUSE_PATH
        value: /data/clinic.duckdb
